langcode: en
status: true
dependencies:
  config:
    - filter.format.full_html
  module:
    - ckeditor5
format: full_html
editor: ckeditor5
settings:
  toolbar:
    items:
      - undo
      - redo
      - '|'
      - heading
      - bold
      - italic
      - superscript
      - subscript
      - '|'
      - removeFormat
      - '|'
      - alignment
      - '|'
      - link
      - '|'
      - bulletedList
      - numberedList
      - indent
      - outdent
      - '|'
      - drupalMedia
      - blockQuote
      - insertTable
      - specialCharacters
      - horizontalLine
      - pageBreak
      - '|'
      - showBlocks
      - fullscreen
      - sourceEditing
      - code
      - codeBlock
      - style
      - icon
  plugins:
    ckeditor5_alignment:
      enabled_alignments:
        - center
        - left
        - right
    ckeditor5_codeBlock:
      languages:
        -
          label: 'Plain text'
          language: plaintext
        -
          label: C
          language: c
        -
          label: 'C#'
          language: cs
        -
          label: C++
          language: cpp
        -
          label: CSS
          language: css
        -
          label: Diff
          language: diff
        -
          label: HTML
          language: html
        -
          label: Java
          language: java
        -
          label: JavaScript
          language: javascript
        -
          label: PHP
          language: php
        -
          label: Python
          language: python
        -
          label: Ruby
          language: ruby
        -
          label: TypeScript
          language: typescript
        -
          label: XML
          language: xml
    ckeditor5_heading:
      enabled_headings:
        - heading2
        - heading3
        - heading4
        - heading5
        - heading6
    ckeditor5_list:
      properties:
        reversed: true
        startIndex: true
      multiBlock: true
    ckeditor5_plugin_pack_indent_block__indent_block:
      enabled: true
    ckeditor5_plugin_pack_text_transformation__text_transformation:
      enabled: true
      extra_transformations: ''
      extra_regex_transformations: {  }
      groups:
        typography:
          transformations:
            ellipsis:
              enabled: 1
            enDash:
              enabled: 1
            emDash:
              enabled: 1
          enabled: 1
        quotes:
          transformations:
            quotesPrimary:
              enabled: 1
            quotesSecondary:
              enabled: 1
          enabled: 1
        symbols:
          transformations:
            trademark:
              enabled: 1
            registeredTrademark:
              enabled: 1
            copyright:
              enabled: 1
          enabled: 1
        mathematical:
          transformations:
            oneHalf:
              enabled: 1
            oneThird:
              enabled: 1
            twoThirds:
              enabled: 1
            oneFourth:
              enabled: 1
            threeQuarters:
              enabled: 1
            lessThanOrEqual:
              enabled: 1
            greaterThanOrEqual:
              enabled: 1
            notEqual:
              enabled: 1
            arrowLeft:
              enabled: 1
            arrowRight:
              enabled: 1
          enabled: 1
        misc:
          transformations:
            quotesPrimaryEnGb:
              enabled: 0
            quotesSecondaryEnGb:
              enabled: 0
            quotesPrimaryPl:
              enabled: 0
            quotesSecondaryPl:
              enabled: 0
          enabled: 0
    ckeditor5_plugin_pack_word_count__word_count:
      word_count_enabled: true
      word_count_mode: words_chars
    ckeditor5_sourceEditing:
      allowed_tags: {  }
    ckeditor5_style:
      styles:
        -
          label: 'Dark Table'
          element: '<table class="osu-table">'
        -
          label: 'Beaver Orange Table'
          element: '<table class="osu-table-orange">'
        -
          label: 'Display 1'
          element: '<p class="display-1">'
        -
          label: 'Display 2'
          element: '<p class="display-2">'
        -
          label: 'Display 3'
          element: '<p class="display-3">'
        -
          label: 'Display 4'
          element: '<p class="display-4">'
        -
          label: 'Display 5'
          element: '<p class="display-5">'
        -
          label: 'Display 6'
          element: '<p class="display-6">'
        -
          label: 'Font Size 1'
          element: '<p class="fs-1">'
        -
          label: 'Font Size 2'
          element: '<p class="fs-2">'
        -
          label: 'Font Size 3'
          element: '<p class="fs-3">'
        -
          label: 'Font Size 4'
          element: '<p class="fs-4">'
        -
          label: 'Font Size 5'
          element: '<p class="fs-5">'
        -
          label: 'Font Size 6'
          element: '<p class="fs-6">'
    ckeditor_link_styles_linkStyles:
      styles: {  }
    editor_advanced_link_link:
      enabled_attributes: {  }
    linkit_extension:
      linkit_enabled: true
      linkit_profile: default
    media_media:
      allow_view_mode_override: true
image_upload:
  status: true
  scheme: public
  directory: inline-images
  max_size: null
  max_dimensions:
    width: null
    height: null
